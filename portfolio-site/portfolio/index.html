
<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dhairya Thakkar Portfolio</title>


<style>

body {
    margin:0;
    background:#111;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:Arial, sans-serif;
}


#toolbar {
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:white;
    padding:4px;
    border-radius:8px;
    background:rgba(17,17,17,.9);
}


button {
    padding:10px 18px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    margin:5px;
}


#flipbook {
    background:white;
}


#pdf-viewer {
    display:none;
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    border:0;
    background:white;
    z-index:10;
}


</style>


<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js">
</script>


</head>


<body>


<div id="toolbar">

<button onclick="location.href='../index.html'">
← Back
</button>


<button onclick="showFlipbook()">
Flipbook
</button>

<button onclick="showPdfViewer()">
PDF viewer
</button>

<a href="../assets/Dhairya_Thakkar_Portfolio.pdf"
target="_blank"
download>

<button>
Download PDF
</button>

</a>

</div>



<div id="flipbook"></div>


<iframe
id="pdf-viewer"
src="../assets/Dhairya_Thakkar_Portfolio.pdf"
title="Dhairya Thakkar portfolio PDF">
</iframe>



<script>


const images = [

"pages/048.webp"

];


const pageFlip = new St.PageFlip(

document.getElementById("flipbook"),

{

width:600,
height:850,

size:"stretch",

minWidth:315,
maxWidth:1000,

minHeight:420,
maxHeight:1350,


showCover:true,

mobileScrollSupport:false

}

);



pageFlip.loadFromImages(images);

function showFlipbook() {
     document.getElementById("flipbook").style.display = "block";
     document.getElementById("pdf-viewer").style.display = "none";
}


function showPdfViewer() {
     document.getElementById("flipbook").style.display = "none";
     document.getElementById("pdf-viewer").style.display = "block";
}




document.addEventListener(
"keydown",
(e)=>{

if(e.key==="ArrowRight")
    pageFlip.flipNext();


if(e.key==="ArrowLeft")
    pageFlip.flipPrev();

}
);


</script>


</body>

</html>
